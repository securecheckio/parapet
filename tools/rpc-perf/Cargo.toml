[package]
name = "rpc-perf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Lower-bound latency: JSON-RPC sendRawTransaction / simulateTransaction through parapet-rpc-proxy + rule engine with a local mock upstream (upstream_delay_ms=0). No real Solana network. Defaults: send → fixtures/baseline-rules.json; simulate → fixtures/simulation-rules.json."
default-run = "rpc-perf"

[lib]
name = "rpc_perf"
path = "src/lib.rs"

[[bin]]
name = "rpc-perf"
path = "src/main.rs"

[dependencies]
parapet-rpc-proxy = { path = "../../rpc-proxy" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
bincode = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
solana-address-lookup-table-interface = { workspace = true, features = ["bincode", "bytemuck"] }
rand = { version = "0.8", features = ["std"] }
rand_chacha = "0.3"
solana-sdk = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-system-interface = { workspace = true }
